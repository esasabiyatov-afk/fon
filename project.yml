name: Fon
options:
  bundleIdPrefix: com.personal
  developmentLanguage: ru
  deploymentTarget:
    iOS: "16.0"
targets:
  Fon:
    type: application
    platform: iOS
    sources:
      - path: Fon
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Fon
        # Системные кнопки (Отмена, Назад, Изменить) — на русском.
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        # Номер версии подставляет сборка в GitHub (1.<номер сборки>) — по нему SideStore видит обновления.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.fon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
