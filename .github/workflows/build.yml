name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md'] # правки описаний (CLAUDE.md, README) не создают новую версию приложения
  workflow_dispatch:

permissions:
  contents: write # чтобы выложить сборку в Releases

# Новая сборка отменяет незаконченную старую — иначе старая могла выйти позже и стать «последней».
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Mac на arm64 у GitHub бывают перегружены (сборка часами ждёт машину) — собираем на Intel.
    runs-on: macos-15-intel
    env:
      VERSION: 1.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Fon.xcodeproj \
            -scheme Fon \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Fon.app Payload/
          zip -qry Fon.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Fon-ipa
          path: Fon.ipa

      # Источник для SideStore: https://github.com/<владелец>/<репо>/releases/latest/download/apps.json
      # Каждая сборка — новый релиз с Fon.ipa и apps.json; SideStore по нему видит обновление.
      - name: Make SideStore source
        env:
          REPO: ${{ github.repository }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          repo, version, build = os.environ["REPO"], os.environ["VERSION"], os.environ["BUILD"]
          lines = (os.environ.get("NOTES") or "").splitlines()
          notes = "\n".join(l for l in lines if not l.startswith(("Co-Authored-By", "Claude-Session"))).strip() or "Новая сборка"
          raw = f"https://raw.githubusercontent.com/{repo}/main/Fon/Assets.xcassets/AppIcon.appiconset/icon.png"
          source = {
              "name": "Fon",
              "identifier": "com.personal.fon.source",
              "subtitle": "YouTube с музыкой в фоне",
              "iconURL": raw,
              "tintColor": "FF3355",
              "apps": [{
                  "name": "Fon",
                  "bundleIdentifier": "com.personal.fon",
                  "developerName": repo.split("/")[0],
                  "subtitle": "YouTube с музыкой в фоне",
                  "localizedDescription": "Обёртка над m.youtube.com: музыка в фоне, режим музыки, своя медиатека.",
                  "iconURL": raw,
                  "tintColor": "FF3355",
                  "category": "entertainment",
                  "versions": [{
                      "version": version,
                      "buildVersion": build,
                      "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "localizedDescription": notes,
                      "downloadURL": f"https://github.com/{repo}/releases/download/build-{build}/Fon.ipa",
                      "size": os.path.getsize("Fon.ipa"),
                      "minOSVersion": "16.0",
                  }],
                  "appPermissions": {"entitlements": [], "privacy": {}},
              }],
              "news": [],
          }
          with open("apps.json", "w", encoding="utf-8") as f:
              json.dump(source, f, ensure_ascii=False, indent=2)
          with open("notes.txt", "w", encoding="utf-8") as f:
              f.write(notes)
          PY

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Если уже выложена сборка новее (эта долго ждала машину) — не откатываем SideStore на старую.
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null | sed 's/^build-//')
          if [ -n "$latest" ] && [ "$latest" -gt "$BUILD" ] 2>/dev/null; then
            echo "Уже есть сборка $latest, новее этой ($BUILD) — не публикую."
            exit 0
          fi
          gh release create "build-$BUILD" Fon.ipa apps.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Fon $VERSION" \
            --notes-file notes.txt \
            --latest
